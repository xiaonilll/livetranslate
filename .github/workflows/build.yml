name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner ships a full Android SDK at /usr/local/lib/android/sdk.
      # android-actions/setup-android@v3 tries to install the retired 'tools'
      # package on top of it and fails ("Failed to find package 'tools'"),
      # so we just point at what is already on the image.
      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          ls /usr/local/lib/android/sdk

      - name: Accept licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install SDK platform 34
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" "build-tools;34.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build APKs
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk
          if-no-files-found: error
